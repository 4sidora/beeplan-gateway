; BeePlan — концентратор (ESP32 + ESP-NOW RX, Wi‑Fi uplink)

[platformio]
default_envs = ttgo-t-call-v14

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson@^7

[env:esp32dev]
board = esp32dev

; LILYGO TTGO T-Call V1.4 — ESP32 + SIM800, Wi-Fi uplink
[env:ttgo-t-call-v14]
extends = env:esp32dev
