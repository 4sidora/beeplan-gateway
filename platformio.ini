; BeePlan — концентратор (ESP32 + ESP-NOW RX, Wi‑Fi uplink)

[platformio]
default_envs = ttgo-t-call-v14

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson@^7

[env:esp32dev]
board = esp32dev

; LILYGO TTGO T-Call V1.4 — ESP32 + SIM800 (Wi‑Fi или GPRS uplink)
[env:ttgo-t-call-v14]
extends = env:esp32dev
build_flags =
  -D BEEPLAN_BOARD_TTGO_T_CALL=1
  -D MODEM_TX=27
  -D MODEM_RX=26
  -D MODEM_PWRKEY=4
  -D MODEM_RST=5
  -D MODEM_POWER_ON=23
lib_deps =
  ${env.lib_deps}
  vshymanskyy/TinyGSM@^0.12.0
